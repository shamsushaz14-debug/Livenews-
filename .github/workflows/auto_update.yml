name: Auto Update YouTube m3u8

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run Extraction Script
        run: python update_m3u8.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add streams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-updated HD m3u8 links" && git push)
